[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-signal"
version = "0.1.0"
description = "Reusable, configuration-driven public-health surveillance dashboard library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Wei Lu", email = "wlu4@worldbank.org" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.scripts]
health-signal = "health_signal.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/health_signal"]
artifacts = ["src/health_signal/_ui/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

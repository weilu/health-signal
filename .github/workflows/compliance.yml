---
name: Open Source Compliance
on:
  push:
  pull_request:
  schedule:
    - cron: '17 2 * * *'   # daily 02:17 UTC — periodic compliance check
  workflow_dispatch:
    inputs:
      history_depth:
        description: 'Commits to scan for secrets (0 = off)'
        type: number
        default: 0
permissions:
  contents: read
  security-events: read
  actions: read
  issues: write
  pull-requests: write
jobs:
  run:
    # Pinned to an immutable commit SHA (worldbank/open-source-kit main @ 2026-09-23) rather than a
    # mutable branch, so an upstream change can't run with this repo's write permissions. Bump deliberately.
    uses: worldbank/open-source-kit/.github/workflows/repo-compliance.yml@3c0f37b0cdbec3854942438e2600efa2ecdc5ce7
    with:
      history_depth: ${{ inputs.history_depth || 0 }}
    secrets: inherit

name: Open Source Compliance
on:
  push:
  pull_request:
  schedule:
    - cron: '17 2 * * *'   # daily 02:17 UTC — periodic compliance check
  workflow_dispatch:
    inputs:
      history_depth:
        description: 'Commits to scan for secrets (0 = off)'
        type: number
        default: 0
permissions:
  contents: read
  security-events: read
  actions: read
  issues: write
  pull-requests: write
jobs:
  run:
    uses: worldbank/open-source-kit/.github/workflows/repo-compliance.yml@main
    with:
      history_depth: ${{ inputs.history_depth || 0 }}
    secrets: inherit

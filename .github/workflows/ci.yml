---
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (project + dev group)
        run: uv sync
      - name: Test
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build wheel (build hook compiles the frontend) and verify the SPA is packaged
        run: |
          uv build --wheel
          python -c "import glob, zipfile; whl = sorted(glob.glob('dist/*.whl'))[-1]; names = zipfile.ZipFile(whl).namelist(); assert any(n.endswith('health_signal/_ui/index.html') for n in names), 'SPA index.html missing from wheel'; assert any('health_signal/_ui/assets/' in n for n in names), 'SPA assets missing from wheel'; print('wheel packages the SPA:', whl)"

---
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (project + dev group)
        run: uv sync
      - name: Test
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Frontend unit tests
        run: npm --prefix frontend ci && npm --prefix frontend test
      - name: Build wheel (build hook compiles the frontend) and verify the SPA is packaged
        run: |
          uv build --wheel
          python - <<'PY'
          import glob
          import zipfile

          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith("health_signal/_ui/index.html") for n in names), "SPA index.html missing from wheel"
          assert any("health_signal/_ui/assets/" in n for n in names), "SPA assets missing from wheel"
          print("wheel packages the SPA:", whl)
          PY
  analytics-r:
    # The R-backed tests: the main job stays R-free, as the app is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::remotes
          cache-version: 1
      - name: Install aedseo (pinned, as assessed_with.csv records it)
        run: Rscript -e 'remotes::install_version("aedseo", version = "1.1.0", repos = "https://cloud.r-project.org")'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync with the analytics extra
        run: uv sync --extra analytics
      - name: R-backed tests
        env:
          HS_REQUIRE_R: "1"
        run: uv run pytest -q -m r

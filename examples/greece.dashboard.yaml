# Example dashboard.yaml for the Greece / Attica pilot.

schema_version: "1.0.0"

site:
  title: "Greece Public Health Early Warning & Surveillance"
  default_locale: el
  locales: [en, el]
  # Path prefixes that bypass auth; [] = everything behind login.
  public_paths: []
  # This dashboard's own text (tab, panel and location names, its profile's extra units), en.json and el.json
  # over the library's catalogue; relative to where the app runs, like the data dirs.
  locales_dir: locales

branding:
  theme:
    palette:
      primary:   { main: "#B5860B" }    # --amber  (brand / active)
      secondary: { main: "#4F7C5E" }    # --green  (signal-low)
      background:
        default: "#F2EEE4"              # --bg      (page)
        paper:   "#FBFAF6"              # --surface (cards)
      text:
        primary:   "#1A1612"            # --ink
        secondary: "#5C5650"            # --ink-2
      divider: "#D9D2C5"                # --rule

# Header filters: every panel is queried for the selected location. ERVISS is national; Attica rows
# would come from Greece's ETL.
filters:
  location:
    default: Greece
    options:
      - { value: Greece, label_key: "locations.national" }
      - { value: Attica, label_key: "locations.attica" }

# W21-W20 respiratory years: the date presets and the analytics' seasons. The
# default view is the last 52 weeks (filters.date_range.default_weeks).
surveillance:
  year_start_week: 21

# The clinical feed is EODY's weekly series in ERVISS's shape. ERVISS's vocabulary lacks some of them: SARI
# per 1,000 admissions and ILI per 1,000 consultations (each modelled against its own denominator), the
# private-hospital network, and SARI's paediatric group, which EODY defines by hospital rather than age band.
profiles:
  erviss_gr:
    extends: erviss
    indicators: [consultations]
    units: [per_1000_admissions, per_1000_consultations]
    dimension_vocab: { survtype: [private hospital], age: [paediatric] }
    denominators:
      - { rate: SARIrate, unit: per_1000_admissions, denominator: hospitaladmissions, per: 1000 }
      - { rate: ILIconsultationrate, unit: per_1000_consultations, denominator: consultations, per: 1000 }

# One directory per feed, each validated against its profile. Paths are the deployment's; this repo
# ships no data.
data:
  feeds:
    - { id: clinical,   profile: erviss_gr, dir: data/clinical,  assessments: data/clinical/assessed }
    - { id: wastewater, profile: phes_odm,  dir: data/wastewater, assessments: data/wastewater/assessed }
  # Written by `health-signal assess` from analytics.phase_streams below.
  phases: data/phase.csv
  phase_streams: data/phase_streams.csv

# What `health-signal assess` decides by policy (the statistics' settings stay in the method). The phase
# pairs are a cases stream and an admissions stream, each in season. COVID's
# cases stream is Attica wastewater; Attica influenza has no local cases stream, and RSV no admissions
# panel here, so neither gets a phase.
analytics:
  min_seasons: 3
  wave_pathogens: [SARS-CoV-2]
  aedseo:
    wave_end: { steps_with_decrease: 3, burden_level_decrease: medium }
  phase_streams:
    - pathogen: SARS-CoV-2
      location: Attica
      streams: { cases: wastewater/ww_load, admissions: clinical/hospital_admissions }
    - pathogen: Influenza
      location: Greece
      streams: { cases: clinical/sentinel_positivity, admissions: clinical/hospital_admissions }

# Wastewater pages show the flow- and population-normalised load (floMean, gene copies/day per 100k)
# per PHES-ODM measure (generic codes until assay targets are pinned). Raw concentration (me) stays in
# the feed but isn't charted: it moves with dilution, so it misleads read on its own.
# Clinical pages show the pilot's clinical indicators, in ERVISS's vocabulary plus erviss_gr's. Labels are
# i18n keys. Each query should match one row per series per week; series_by splits it.
targets:
  - id: SARS-CoV-2
    pages:
      - id: overview
        panels:
          - { id: phase, type: phase }
          - { id: summary, type: summary }
      - id: clinical
        panels:
          - id: hospital_admissions
            query: { feed: clinical, indicator: hospitaladmissions, dimensions: { survtype: non-sentinel, pathogen: SARS-CoV-2, age: total } }
          - id: icu_admissions
            query: { feed: clinical, indicator: ICUadmissions, dimensions: { survtype: non-sentinel, pathogen: SARS-CoV-2, age: total } }
          - id: deaths
            query: { feed: clinical, indicator: deaths, dimensions: { survtype: non-sentinel, pathogen: SARS-CoV-2, age: total } }
          - id: test_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: non-sentinel, pathogen: SARS-CoV-2, age: total } }
          - id: sari_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: SARI virological, pathogen: SARS-CoV-2, age: total } }
          - id: sentinel_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: primary care sentinel, pathogen: SARS-CoV-2, age: total } }
          - id: sari_rate
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic, age: total } }
          - id: sari_rate_by_age
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic } }
            series_by: age
          - id: ili_rate
            query: { feed: clinical, indicator: ILIconsultationrate, dimensions: { survtype: primary care syndromic, age: total } }
      - id: wastewater
        panels:
          - id: ww_load
            query: { feed: wastewater, indicator: cov, dimensions: { aggregation: floMean } }
  - id: Influenza
    pages:
      - id: overview
        panels:
          - { id: phase, type: phase }
          - { id: summary, type: summary }
      - id: clinical
        panels:
          - id: hospital_admissions
            query: { feed: clinical, indicator: hospitaladmissions, dimensions: { survtype: non-sentinel, pathogen: Influenza, age: total } }
          - id: icu_admissions_a
            query: { feed: clinical, indicator: ICUadmissions, dimensions: { survtype: non-sentinel, pathogen: Influenza, pathogentype: Influenza A, age: total } }
          - id: icu_admissions_b
            query: { feed: clinical, indicator: ICUadmissions, dimensions: { survtype: non-sentinel, pathogen: Influenza, pathogentype: Influenza B, age: total } }
          - id: deaths
            query: { feed: clinical, indicator: deaths, dimensions: { survtype: non-sentinel, pathogen: Influenza, age: total } }
          - id: sari_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: SARI virological, pathogen: Influenza, pathogentype: Influenza, pathogensubtype: total, age: total } }
          - id: sentinel_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: primary care sentinel, pathogen: Influenza, pathogentype: Influenza, pathogensubtype: total, age: total } }
          - id: private_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: private hospital, pathogen: Influenza, pathogentype: Influenza, pathogensubtype: total, age: total } }
          - id: influenza_a_subtypes
            query: { feed: clinical, indicator: detections, dimensions: { survtype: primary care sentinel, pathogen: Influenza, pathogentype: Influenza A, age: total } }
            series_by: pathogensubtype
          - id: influenza_b_lineages
            query: { feed: clinical, indicator: detections, dimensions: { survtype: primary care sentinel, pathogen: Influenza, pathogentype: Influenza B, age: total } }
            series_by: pathogensubtype
          - id: sari_rate
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic, age: total } }
          - id: sari_rate_by_age
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic } }
            series_by: age
          - id: ili_rate
            query: { feed: clinical, indicator: ILIconsultationrate, dimensions: { survtype: primary care syndromic, age: total } }
      - id: wastewater
        panels:
          - id: ww_flu_a_load
            query: { feed: wastewater, indicator: fluA, dimensions: { aggregation: floMean } }
          - id: ww_flu_b_load
            query: { feed: wastewater, indicator: fluB, dimensions: { aggregation: floMean } }
  - id: RSV
    pages:
      - id: overview
        panels:
          - { id: phase, type: phase }
          - { id: summary, type: summary }
      - id: clinical
        panels:
          - id: sari_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: SARI virological, pathogen: RSV, pathogentype: RSV, age: total } }
          - id: sentinel_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: primary care sentinel, pathogen: RSV, pathogentype: RSV, age: total } }
          - id: private_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: private hospital, pathogen: RSV, pathogentype: RSV, age: total } }
          - id: sari_rate
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic, age: total } }
          - id: sari_rate_by_age
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic } }
            series_by: age
          - id: ili_rate
            query: { feed: clinical, indicator: ILIconsultationrate, dimensions: { survtype: primary care syndromic, age: total } }
      - id: wastewater
        panels:
          - id: ww_load
            query: { feed: wastewater, indicator: rsvMe, dimensions: { aggregation: floMean } }

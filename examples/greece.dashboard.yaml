# Example dashboard.yaml — Greece / Attica pilot.
# Pass to the app via the config path it loads at startup

schema_version: "1.0.0"

site:
  title: "Greece Public Health Early Warning & Surveillance"
  default_locale: el
  locales: [en, el]
  # Path prefixes that bypass auth ([] = everything behind login). e.g. ["/covid"] to open a page.
  public_paths: []

branding:
  theme:
    palette:
      primary:   { main: "#B5860B" }    # --amber  (brand / active)
      secondary: { main: "#4F7C5E" }    # --green  (signal-low)
      background:
        default: "#F2EEE4"              # --bg      (page)
        paper:   "#FBFAF6"              # --surface (cards)
      text:
        primary:   "#1A1612"            # --ink
        secondary: "#5C5650"            # --ink-2
      divider: "#D9D2C5"                # --rule

# Dashboard-wide filters, shown in the header. Every panel is queried for the selected location; a
# panel with no data for it says so. ERVISS itself is national, so Attica rows come from Greece's ETL.
filters:
  location:
    default: Greece
    options:
      - { value: Greece, label_key: "locations.national" }
      - { value: Attica, label_key: "locations.attica" }

# Surveillance targets × pages × panels. Labels are i18n keys resolved from the locale catalogs, not
# text. A panel's `query` is a set of /api/data filters, applied with the dashboard filters above; it
# should match one row per series per week (checked against the public ERVISS snapshot), and
# `series_by` splits it into lines.
targets:
  - id: covid
    label_key: "targets.covid"
    pages:
      - id: covid-overview
        path: /covid
        label_key: "pages.overview"
        panels:
          - id: covid-positivity
            type: timeseries
            label_key: "panels.positivity"
            query: { indicator: positivity, pathogen: SARS-CoV-2, age: total }
            series_by: survtype
  - id: influenza
    label_key: "targets.influenza"
    pages:
      - id: flu-overview
        path: /influenza
        label_key: "pages.overview"
        panels:
          - id: flu-positivity
            type: timeseries
            label_key: "panels.positivity"
            query: { indicator: positivity, pathogen: Influenza, pathogentype: Influenza, pathogensubtype: total, age: total }
            series_by: survtype
          - id: ili-rate
            type: timeseries
            label_key: "panels.ili"
            query: { indicator: ILIconsultationrate, age: total }
  - id: rsv
    label_key: "targets.rsv"
    pages:
      - id: rsv-overview
        path: /rsv
        label_key: "pages.overview"
        panels:
          - id: rsv-positivity
            type: timeseries
            label_key: "panels.positivity"
            query: { indicator: positivity, pathogen: RSV, pathogentype: RSV, age: total }
            series_by: survtype

# Example dashboard.yaml for the Greece / Attica pilot.

schema_version: "1.0.0"

site:
  title: "Greece Public Health Early Warning & Surveillance"
  default_locale: el
  locales: [en, el]
  # Path prefixes that bypass auth; [] = everything behind login.
  public_paths: []

branding:
  theme:
    palette:
      primary:   { main: "#B5860B" }    # --amber  (brand / active)
      secondary: { main: "#4F7C5E" }    # --green  (signal-low)
      background:
        default: "#F2EEE4"              # --bg      (page)
        paper:   "#FBFAF6"              # --surface (cards)
      text:
        primary:   "#1A1612"            # --ink
        secondary: "#5C5650"            # --ink-2
      divider: "#D9D2C5"                # --rule

# Header filters: every panel is queried for the selected location. ERVISS is national; Attica rows
# would come from Greece's ETL.
filters:
  location:
    default: Greece
    options:
      - { value: Greece, label_key: "locations.national" }
      - { value: Attica, label_key: "locations.attica" }
  # Yearly presets run W21-W20, greece-public-health's respiratory year; the default view is the
  # last 52 weeks (default_weeks).
  date_range:
    year_start_week: 21

# One directory per feed, each validated against its profile. Paths are the deployment's; this repo
# ships no data.
data:
  feeds:
    - { id: clinical,   profile: erviss,   dir: data/clinical }
    - { id: wastewater, profile: phes_odm, dir: data/wastewater }

# Wastewater pages show the flow- and population-normalised load (floMean, gene copies/day per 100k)
# per PHES-ODM measure (generic codes until assay targets are pinned). Raw concentration (me) stays in
# the feed but isn't charted: it moves with dilution, so it misleads read on its own.
# Clinical pages mirror greece-public-health's Clinical view where ERVISS has the data. Labels are i18n keys. Each
# query should match one row per series per week (checked against ERVISS); series_by splits it.
targets:
  - id: SARS-CoV-2
    pages:
      - id: clinical
        panels:
          - id: hospital_admissions
            query: { feed: clinical, indicator: hospitaladmissions, dimensions: { survtype: non-sentinel, pathogen: SARS-CoV-2, age: total } }
          - id: icu_admissions
            query: { feed: clinical, indicator: ICUadmissions, dimensions: { survtype: non-sentinel, pathogen: SARS-CoV-2, age: total } }
          - id: deaths
            query: { feed: clinical, indicator: deaths, dimensions: { survtype: non-sentinel, pathogen: SARS-CoV-2, age: total } }
          - id: sari_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: SARI virological, pathogen: SARS-CoV-2, age: total } }
          - id: sentinel_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: primary care sentinel, pathogen: SARS-CoV-2, age: total } }
          - id: sari_rate
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic, age: total } }
          - id: sari_rate_by_age
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic } }
            series_by: age
          - id: ili_rate
            query: { feed: clinical, indicator: ILIconsultationrate, dimensions: { survtype: primary care syndromic, age: total } }
      - id: wastewater
        panels:
          - id: ww_load
            query: { feed: wastewater, indicator: cov, dimensions: { aggregation: floMean } }
  - id: Influenza
    pages:
      - id: clinical
        panels:
          - id: hospital_admissions
            query: { feed: clinical, indicator: hospitaladmissions, dimensions: { survtype: non-sentinel, pathogen: Influenza, age: total } }
          - id: icu_admissions
            query: { feed: clinical, indicator: ICUadmissions, dimensions: { survtype: non-sentinel, pathogen: Influenza, age: total } }
          - id: deaths
            query: { feed: clinical, indicator: deaths, dimensions: { survtype: non-sentinel, pathogen: Influenza, age: total } }
          - id: sari_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: SARI virological, pathogen: Influenza, pathogentype: Influenza, pathogensubtype: total, age: total } }
          - id: sentinel_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: primary care sentinel, pathogen: Influenza, pathogentype: Influenza, pathogensubtype: total, age: total } }
          - id: influenza_a_subtypes
            query: { feed: clinical, indicator: detections, dimensions: { survtype: primary care sentinel, pathogen: Influenza, pathogentype: Influenza A, age: total } }
            series_by: pathogensubtype
          - id: influenza_b_lineages
            query: { feed: clinical, indicator: detections, dimensions: { survtype: primary care sentinel, pathogen: Influenza, pathogentype: Influenza B, age: total } }
            series_by: pathogensubtype
          - id: sari_rate
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic, age: total } }
          - id: sari_rate_by_age
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic } }
            series_by: age
          - id: ili_rate
            query: { feed: clinical, indicator: ILIconsultationrate, dimensions: { survtype: primary care syndromic, age: total } }
      - id: wastewater
        panels:
          - id: ww_flu_a_load
            query: { feed: wastewater, indicator: fluA, dimensions: { aggregation: floMean } }
          - id: ww_flu_b_load
            query: { feed: wastewater, indicator: fluB, dimensions: { aggregation: floMean } }
  - id: RSV
    pages:
      - id: clinical
        panels:
          - id: sari_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: SARI virological, pathogen: RSV, pathogentype: RSV, age: total } }
          - id: sentinel_positivity
            query: { feed: clinical, indicator: positivity, dimensions: { survtype: primary care sentinel, pathogen: RSV, pathogentype: RSV, age: total } }
          - id: sari_rate
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic, age: total } }
          - id: sari_rate_by_age
            query: { feed: clinical, indicator: SARIrate, dimensions: { survtype: SARI syndromic } }
            series_by: age
          - id: ili_rate
            query: { feed: clinical, indicator: ILIconsultationrate, dimensions: { survtype: primary care syndromic, age: total } }
      - id: wastewater
        panels:
          - id: ww_load
            query: { feed: wastewater, indicator: rsvMe, dimensions: { aggregation: floMean } }
